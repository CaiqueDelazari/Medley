<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada — BOLIN Electric Motor</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --ground:#FFF9F5; --paper:#FFFFFF; --ink:#1B1512; --muted:#8A7C72;
    --line:#F2E3D8; --accent:#EE7315; --accent-deep:#C95A08; --accent-ink:#FFFFFF;
    --sans:"Segoe UI Variable Display","Segoe UI",-apple-system,BlinkMacSystemFont,
           Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    padding:32px; background:var(--ground); color:var(--ink);
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
  }
  .caixa{max-width:520px; text-align:center}
  img{width:72px; height:auto; border-radius:14px; margin-bottom:28px}
  .codigo{
    font-size:13px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent-deep); margin:0 0 12px;
  }
  h1{font-size:clamp(26px,5vw,34px); line-height:1.15; margin:0 0 14px; letter-spacing:-.02em}
  p{color:var(--muted); line-height:1.6; margin:0 0 32px; font-size:16px}
  .botoes{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
  a{
    display:inline-block; padding:13px 26px; border-radius:999px;
    text-decoration:none; font-weight:600; font-size:15px;
  }
  .principal{background:var(--accent); color:var(--accent-ink)}
  .principal:hover{background:var(--accent-deep)}
  .secundario{background:var(--paper); color:var(--ink); border:1px solid var(--line)}
  .secundario:hover{border-color:var(--accent)}
</style>
</head>
<body>
  <div class="caixa">
    <img src="/Logo (2).jpeg" alt="BOLIN Electric Motor">
    <p class="codigo">Erro 404</p>
    <h1>Esta página não existe</h1>
    <p>O endereço pode ter mudado, ou o link que te trouxe até aqui está com
       algum caractere a mais. O catálogo completo continua no mesmo lugar.</p>
    <div class="botoes">
      <a class="principal" href="/">Ver o catálogo</a>
      <a class="secundario" href="https://wa.me/5511942964321">Falar no WhatsApp</a>
    </div>
  </div>
</body>
</html>
